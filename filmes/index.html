<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial}
header{padding:14px 16px;background:#000;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
header b{color:#ffcc00;font-size:24px}
.row{display:flex;flex-wrap:wrap;gap:12px;padding:16px}
.card{width:150px;cursor:pointer}
.card img{width:150px;height:225px;object-fit:cover;object-position:top center;border-radius:12px;background:#111;border:1px solid #222;display:block}
.card p{font-size:13px;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player{position:fixed;inset:0;background:rgba(0,0,0,.95);display:none;z-index:99;flex-direction:column}
#player.active{display:flex;justify-content:center;align-items:center}
.box-video{width:100%;max-width:900px;aspect-ratio:16/9;background:#000}
.box-video iframe,.box-video video{width:100%;height:100%;border:0}
</style>

<div class="row" id="lista"></div>

    <video id="v1" controls playsinline style="display:none"></video>
    <iframe id="v2" style="display:none" allowfullscreen></iframe>
  </div>
  <div style="margin-top:20px;text-align:center">
    <h3 id="titulo" style="color:#ffcc00"></h3>
    <button style="margin-top:15px;padding:12px 30px;border-radius:20px;border:0;background:#ffcc00;font-weight:800" onclick="fechar()">X FECHAR</button>

const lista=document.getElementById('lista');
document.getElementById('contador').textContent=filmes.length+' filmes';

lista.innerHTML='';
filmes.forEach((f,i)=>{
  let div=document.createElement('div');
  div.className='card';
  div.innerHTML=`<img src="${f.i}" loading="lazy"><p>${f.t}</p>`;
  div.onclick=()=>abrir(i);
  lista.appendChild(div);
});

function abrir(i){
  let f=filmes[i];
  document.getElementById('titulo').textContent=f.t;
  document.getElementById('player').classList.add('active');
  if(f.l.includes('.mp4')){
    let v=document.getElementById('v1'); v.src=f.l; v.style.display='block'; document.getElementById('v2').style.display='none'; v.play();
  }else{
    document.getElementById('v2').src=f.l+'?autoplay=1'; document.getElementById('v2').style.display='block'; document.getElementById('v1').style.display='none';
  }
}
function fechar(){
  document.getElementById('player').classList.remove('active');
  document.getElementById('v1').pause(); document.getElementById('v1').src=''; document.getElementById('v2').src='';
}
