<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Controle de Gastos</title>
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;padding:15px}input,button{width:100%;padding:12px;margin:5px 0;border-radius:8px;border:none}button{background:#FFD700;color:#000;font-weight:900}.item{display:flex;justify-content:space-between;background:#151515;padding:10px;margin:5px 0;border-radius:8px}.lixeira{background:red;color:#fff;padding:5px 10px;border-radius:5px;width:auto}a{color:#FFD700}</style></head>
<body><h2 style="color:#FFD700">💰 Controle de Gastos</h2><input id="desc" placeholder="Descrição ex: Mercado"><input id="valor" type="number" placeholder="Valor R$"><button onclick="add()">➕ Adicionar</button><div id="lista"></div><h3>Total: R$ <span id="total">0</span></h3>
<button onclick="backup()" style="background:#222;color:#fff">💾 BACKUP</button><button onclick="resetar()" style="background:#500;color:#fff">🗑️ RESETAR TUDO</button><br><br><a href="index.html">◀️ Voltar pro Portal do Povo</a>
<script>
let gastos=JSON.parse(localStorage.getItem('gastos_portal')||'[]');function render(){let l=document.getElementById('lista');l.innerHTML='';let t=0;gastos.forEach((g,i)=>{t+=parseFloat(g.valor);l.innerHTML+=`<div class="item"><span>${g.desc} - R$ ${g.valor}</span><button class="lixeira" onclick="rem(${i})">🗑️</button></div>`});document.getElementById('total').innerText=t.toFixed(2);localStorage.setItem('gastos_portal',JSON.stringify(gastos))}
function add(){let d=document.getElementById('desc').value,v=document.getElementById('valor').value;if(!d||!v)return alert('Preencha');gastos.push({desc:d,valor:v});render();desc.value='';valor.value=''}function rem(i){gastos.splice(i,1);render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(gastos)],{type:'application/json'}));a.download='backup_gastos.json';a.click()}function resetar(){if(confirm('Apagar tudo?')){gastos=[];render()}}render();
</script></body></html>
