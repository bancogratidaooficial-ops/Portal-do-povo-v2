<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- CÓDIGO ADSENSE - COLE SEU CÓDIGO REAL AQUI EMBAIXO -->

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal - Banco Gratidão</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;padding:10px}
header{text-align:center;background:#111;border:2px solid #ffcc00;margin:0;padding:10px;border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:12px;text-align:center}
.card b{display:block;margin-top:6px}
.btn{padding:8px 12px;border-radius:8px;border:none;font-weight:bold;margin:4px}
</style>
</head>
<body>
<header>
<h1 style="color:#ffcc00;margin:0">📋 MEU PORTAL - BANCO GRATIDÃO</h1>
<div class="topBtns" style="margin-top:10px">
<button onclick="novoApp()" style="background:#00ff88;color:#000" class="btn">+ NOVO APP</button>
<button onclick="compartilhar()" style="background:#00aaff;color:#fff" class="btn">Compartilhar</button>
<button onclick="convidar()" style="background:#ffcc00;color:#000" class="btn">Convidar</button>
<button onclick="backup()" style="background:#8888ff;color:#fff" class="btn">Backup</button>
<button onclick="document.getElementById('f').click()" style="background:#fff;color:#000" class="btn">Restaurar</button>
<button onclick="if(confirm('Limpar duplicados com maiúsculas?')){localStorage.clear();location.reload();}" style="background:#ff4444;color:#fff" class="btn">Limpar</button>
<input type="file" id="f" style="display:none" onchange="restaurar(this)">
</div>
</header>

<div class="grid" id="grid"></div>

<script>
const FIXOS=[
{"n":"📋 DÍVIDAS", "f":"dividas.html","c":"#ffcc00","t":"#000"},
{"n":"🏦 Bancos", "f":"bancos.html"},
{"n":"💸 Gastos", "f":"gastos.html"},
{"n":"💬 Mensagens", "f":"mensagens.html"},
{"n":"🎵 Musicas", "f":"musicas.html"},
{"n":"🎬 Videos", "f":"video.html"},
{"n":"📱 Redes", "f":"redes.html"},
{"n":"✂️ Tesoura", "f":"tesoura.html"},
{"n":"🗺️ Mapas", "f":"mapas.html"},
{"n":"🅿️ Estacionamento", "f":"estacionamento.html"},
{"n":"🔧 Ferramentas", "f":"ferramentas.html"},
{"n":"📝 Notas", "f":"notas.html"}
];

let extras = [];
try{ extras = JSON.parse(localStorage.getItem('extras_final')) || []; }catch(e){ extras=[]; }
function save(){ localStorage.setItem('extras_final', JSON.stringify(extras)); }

function render(){
  let g = document.getElementById('grid'); g.innerHTML='';
  let todos = [...FIXOS,...extras];
  todos.forEach((a,i)=>{
    let div = document.createElement('div');
    div.className='card';
    div.style.borderColor = a.c || '#333';
    div.innerHTML=`<div style="font-size:32px">${a.n.split(' ')[0]}</div><b>${a.n}</b><button class="btn" style="background:#111;color:#aaa;border:1px solid #333;margin-top:8px;width:100%" onclick="abrir('${a.f}')">ABRIR</button>` + (i>=FIXOS.length? `<button class="del" onclick="del(${i-FIXOS.length})" style="background:#ff4444;color:#fff;border:none;border-radius:6px;padding:4px 8px;margin-top:6px">Apagar</button>`:'');
    g.appendChild(div);
  });
}
function abrir(f){ location.href=f; }
function novoApp(){
  let n=prompt("Nome:"); if(!n) return;
  let f=prompt("Arquivo ex: notas.html TUDO minusculo:"); if(!f) return;
  extras.push({n:n, f:f}); save(); render();
}
function del(i){ if(confirm("Apagar?")){ extras.splice(i,1); save(); render(); } }
function backup(){
  let blob=new Blob([JSON.stringify(extras)],{type:'application/json'});
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='portal-backup.json'; a.click();
}
function restaurar(input){
  let r=new FileReader();
  r.onload=function(){
    try{ let d=JSON.parse(r.target.result); extras=d; save(); render(); }catch(e){ alert("Erro no arquivo"); }
  };
  r.readAsText(input.files[0]);
}
function compartilhar(){
  let url=location.href;
  if(navigator.share){ navigator.share({url:url}); }else{ prompt("Copia:", url); }
}
function convidar(){
  let url=location.href;
  window.open("https://wa.me/?text="+encodeURIComponent("Meu Portal: "+url));
}
render();
</script>
</body>
</html>
