<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>V86 Filmes - Portal do Povo</title>
<style>body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:10px}video{width:100%;height:240px;background:#000;border:2px solid #FFD700;border-radius:12px}button{width:100%;padding:14px;border-radius:10px;border:none;font-weight:900;margin-top:8px}.tv{background:#e50914;color:#fff}.add{background:#FFD700;color:#000}.item{display:flex;gap:8px;padding:8px;background:#151515;margin:6px 0;border-radius:10px;text-align:left}</style></head>
<body><h2 style="color:#FFD700">📺 V86 FILMES - Portal do Povo</h2><video id="p" controls playsinline></video><div id="n" style="color:#FFD700;margin:6px">Adicione um vídeo</div><button class="tv" onclick="mandar()">📺 MANDAR PRA TV - AIRSCREEN</button><button class="add" onclick="document.getElementById('f').click()">➕ ADD FILME DO CELULAR</button><input type="file" id="f" accept="video/*" multiple style="display:none"><div id="l"></div>
<script>
let filmes=[],idx=0,player=document.getElementById('p'),nome=document.getElementById('n'),lista=document.getElementById('l'),db,req=indexedDB.open('V86_PORTAL_POVO',2);
req.onupgradeneeded=e=>e.target.result.createObjectStore('filmes',{keyPath:'id',autoIncrement:true});
req.onsuccess=e=>{db=e.target.result;carregar()};
function carregar(){let tx=db.transaction('filmes','readonly').objectStore('filmes').getAll();tx.onsuccess=e=>{filmes=e.target.result;montar();if(filmes.length)tocar(0)}}
document.getElementById('f').onchange=e=>{for(let f of e.target.files){let tx=db.transaction('filmes','readwrite');tx.objectStore('filmes').add({nome:f.name,blob:f})}setTimeout(carregar,500)};
function montar(){lista.innerHTML='';filmes.forEach((f,i)=>{let d=document.createElement('div');d.className='item';let u=URL.createObjectURL(f.blob);d.innerHTML=`<video src="${u}" muted style="width:60px;height:40px;border:none"></video><div style="flex:1;font-size:12px">${f.nome}</div>`;d.onclick=()=>tocar(i);lista.appendChild(d)})}
function tocar(i){idx=i;let f=filmes[i];let u=URL.createObjectURL(f.blob);player.src=u;nome.innerText=f.nome;player.play()}
function mandar(){if(!filmes[idx]){alert('Adicione um vídeo primeiro');return}if(player.remote){player.remote.prompt().then(()=>alert('Procurando AS-TVBOX...')).catch(()=>alert('No player clique nos 3 pontinhos > Transmitir > Escolha AS-TVBOX'))}else{alert('Toca o vídeo > clica nos 3 pontinhos do vídeo > Transmitir > AS-TVBOX')}}
</script><br><a href="index.html" style="color:#FFD700">◀️ Voltar pro Portal do Povo</a></body></html>
