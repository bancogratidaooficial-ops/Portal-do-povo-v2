<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mapas - Portal do Povo</title>
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;padding:12px}h2{color:#FFD700;text-align:center}input,button{width:100%;padding:13px;border-radius:10px;border:none;margin:5px 0}button{background:#FFD700;color:#000;font-weight:900}.voltar{background:#111;color:#FFD700;border:1px solid #FFD700}iframe{width:100%;height:360px;border:2px solid #FFD700;border-radius:12px;background:#fff}.item{background:#151515;padding:10px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between}.lixeira{background:red;color:#fff;padding:6px 10px;border-radius:6px;width:auto}</style></head>
<body><h2>🗺️ MAPAS - PORTAL DO POVO</h2>
<input id="busca" placeholder="Digite: Curitiba, Shopping Estação, Hospital...">
<button onclick="buscar()">🔍 BUSCAR NO MAPA</button>
<iframe id="mapa" src="https://www.openstreetmap.org/export/embed.html?bbox=-49.35%2C-25.5%2C-49.15%2C-25.35&layer=mapnik&marker=-25.4290%2C-49.2671"></iframe>
<div id="lista"></div>
<button onclick="backup()" style="background:#222;color:#fff">💾 BACKUP LOCAIS</button>
<button onclick="resetar()" style="background:#500;color:#fff">🗑️ RESETAR TUDO</button>
<a href="index.html"><button class="voltar">◀️ VOLTAR PRO PORTAL DO POVO</button></a>
<script>
let locais=JSON.parse(localStorage.getItem('mapas_portal')||'[]');
function render(){let l=document.getElementById('lista');l.innerHTML='';locais.forEach((loc,i)=>{l.innerHTML+=`<div class="item"><span>📍 ${loc}</span><button class="lixeira" onclick="apagar(${i})">🗑️</button></div>`});localStorage.setItem('mapas_portal',JSON.stringify(locais))}
function buscar(){let q=document.getElementById('busca').value.trim();if(!q)return alert('Digite um lugar');locais.push(q);document.getElementById('mapa').src=`https://www.openstreetmap.org/export/embed.html?bbox=-49.35%2C-25.5%2C-49.15%2C-25.35&layer=mapnik&marker=-25.4290%2C-49.2671&q=${encodeURIComponent(q)}`;window.open(`https://www.google.com/maps/search/${encodeURIComponent(q)}/@-25.4290,-49.2671,13z`,'_blank');render()}
function apagar(i){locais.splice(i,1);render()}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(locais)],{type:'application/json'}));a.download='backup_mapas.json';a.click()}
function resetar(){if(confirm('Apagar todos?')){locais=[];render()}}render();
</script></body></html>
